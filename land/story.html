<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anjal B - Experimental storytelling</title>
<meta name="description" content="Anjal B is a designer-researcher telling experimental stories through installation, interactive media, sound and research.">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:#f4f3ef;color:#141412;font-family:"Helvetica Neue",Arial,sans-serif}
.top{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;padding:22px 32px;font-size:13px;z-index:2}
.top a{color:#6b6a63;text-decoration:none;margin-left:22px}.top a:hover{color:#141412}.top a:first-child{margin-left:0}
.hero{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:84px 32px 40px}
.me{--h:clamp(210px,34vh,320px);position:relative;height:var(--h);width:calc(var(--h)*.402);margin-bottom:6px;flex:none;align-self:flex-start}
.me img{position:absolute;inset:0;width:100%;height:100%}
.me .hand{transform-origin:26.3% 81.3%;animation:wave 3.2s ease-in-out infinite}
@keyframes wave{0%,58%,100%{transform:rotate(0)}8%{transform:rotate(-42deg)}18%{transform:rotate(26deg)}28%{transform:rotate(-40deg)}38%{transform:rotate(24deg)}48%{transform:rotate(-30deg)}}
.hi{position:absolute;left:62%;top:62%;font:italic 400 20px Newsreader,Georgia,serif;color:#e2461b;opacity:0;animation:hi 3.2s ease-in-out infinite;white-space:nowrap}
@keyframes hi{0%,4%,56%,100%{opacity:0;transform:translateY(4px)}12%,48%{opacity:1;transform:none}}
.iam{font:italic 400 clamp(22px,3vw,40px)/1 Newsreader,Georgia,serif;color:#6b6a63}
.name{font:400 clamp(76px,17.5vw,270px)/.9 Newsreader,Georgia,serif;letter-spacing:-.04em;margin:.04em 0 .12em -.04em;white-space:nowrap}
h1{font:400 clamp(22px,3vw,44px)/1.22 Newsreader,Georgia,serif;letter-spacing:-.015em;max-width:25em}
h1 a{color:#141412;text-decoration:none;border-bottom:.06em solid #141412;transition:background .15s,color .15s}
h1 a:hover,h1 a:focus-visible{background:#e2461b;color:#f4f3ef;border-color:#e2461b;outline:0}
#r{opacity:0;transition:opacity .9s}#r.in{opacity:1}
.hint{margin-top:22px;font-size:13px;color:#6b6a63;min-height:18px}
.work{padding:0 32px 48px}
.work h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:400;color:#6b6a63;padding:18px 0 12px}
.work a{display:grid;grid-template-columns:48px 1fr auto;gap:16px;align-items:baseline;padding:16px 0;border-top:1px solid #d9d7cf;color:inherit;text-decoration:none}
.work a:last-child{border-bottom:1px solid #d9d7cf}
.work a b{font:400 clamp(22px,3vw,38px)/1.1 Newsreader,Georgia,serif;letter-spacing:-.01em}
.work a span{font-size:13px;color:#6b6a63}
.work a:hover b{color:#e2461b}
.work a.soon{color:#a9a79e;pointer-events:none}
footer{padding:0 32px 28px;font-size:12px;color:#6b6a63;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
@media(max-width:640px){.top,.hero,.work,footer{padding-left:18px;padding-right:18px}.work a{grid-template-columns:30px 1fr}.work a span{grid-column:2}}
@media(prefers-reduced-motion:reduce){#r{transition:none}html{scroll-behavior:auto}.me .hand,.hi{animation:none}.hi{opacity:0}}
</style></head><body>
<div class="top"><a href="#work">Work</a><div><a href="mailto:anjal2098@gmail.com">Contact</a><a href="../resume/">Resume</a></div></div>
<section class="hero">
<div class="me" role="img" aria-label="Illustration of Anjal waving"><img src="anjal-base.png" alt=""><img class="hand" src="anjal-hand.png" alt=""><span class="hi" aria-hidden="true">hi!</span></div>
<div class="iam">I am</div>
<div class="name">Anjal B</div>
<h1>I tell experimental stories through <a href="../bench/" data-i="0">benches that remember</a>, <a href="../music-strip/" data-i="2">songs that outlast their fade</a> and <a id="r" href="#"></a>.</h1>
<div class="hint" id="card">Designer-researcher, Trivandrum</div>
</section>
<section class="work" id="work"><h2>All work</h2><div id="list"></div></section>
<footer><span>Installation, interactive media, sound and research</span><span>Assistant Professor, DC School of Architecture and Design</span></footer>
<script src="data.js"></script>
<script>
var ALT=[{i:1,w:'pianos that teach'},{i:3,w:'statues that hide'},{i:4,w:'rooms that heal'},{i:5,w:'light that leaps'},{i:6,w:'films that can be heard'},{i:7,w:'photographs that play'}];
var last=-1;try{last=+sessionStorage.getItem('lastEnd')}catch(e){}
var pick,tries=0;do{pick=ALT[Math.floor(Math.random()*ALT.length)];tries++}while(pick.i===last&&tries<5);
try{sessionStorage.setItem('lastEnd',pick.i)}catch(e){}
var r=document.getElementById('r'),p=PROJ[pick.i];r.textContent=pick.w;r.href=p.u;r.dataset.i=pick.i;
requestAnimationFrame(function(){setTimeout(function(){r.classList.add('in')},350)});
var c=document.getElementById('card'),def=c.textContent;
document.querySelectorAll('h1 a').forEach(function(a){
 function on(){var q=PROJ[+a.dataset.i];c.textContent=q.n+'  '+q.t+'  -  '+q.k}
 a.addEventListener('mouseenter',on);a.addEventListener('focus',on);
 a.addEventListener('mouseleave',function(){c.textContent=def});a.addEventListener('blur',function(){c.textContent=def});
});
document.getElementById('list').innerHTML=PROJ.map(function(q){return '<a href="'+(q.u||'#')+'"'+(q.u?'':' class="soon"')+'><i style="font-style:normal;font-size:13px;color:#6b6a63">'+q.n+'</i><b>'+q.t+'</b><span>'+q.k+(q.u?'':' - coming soon')+'</span></a>'}).join('');
</script></body></html>
