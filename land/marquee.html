<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anjal B - Marquee</title>
<style>
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{background:#f4f3ef;color:#141412;font-family:"Helvetica Neue",Arial,sans-serif;overflow:hidden;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:baseline;padding:18px 28px;font-size:13px;letter-spacing:.02em}
header b{font-weight:500}header span{color:#6b6a63}
main{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}
.row{display:block;overflow:hidden;white-space:nowrap;border-top:1px solid #d9d7cf;color:inherit;text-decoration:none;flex:1;min-height:0;display:flex;align-items:center}
.row:last-child{border-bottom:1px solid #d9d7cf}
.tr{display:inline-flex;align-items:center;will-change:transform}
.tr span{font-size:clamp(34px,7.2vh,76px);font-weight:500;letter-spacing:-.03em;padding-right:.5em;line-height:1}
.tr i{font-style:normal;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#6b6a63;padding-right:2.5em;align-self:flex-start;margin-top:.5em}
.row:hover .tr span{color:#e2461b}
.row.soon .tr span{color:#a9a79e}
#tip{position:fixed;pointer-events:none;background:#141412;color:#f4f3ef;font-size:12px;padding:7px 11px;border-radius:99px;opacity:0;transform:translate(14px,14px);transition:opacity .15s;white-space:nowrap}
footer{padding:12px 28px;font-size:12px;color:#6b6a63;display:flex;justify-content:space-between}
@media(max-width:640px){header{padding:14px 18px}footer{padding:10px 18px}}
</style></head><body>
<header><b>Anjal B</b><span>Designer-researcher, Trivandrum</span></header>
<main id="m"></main>
<footer><span>Experimental storytelling through installation, interactive media, sound and research</span><span>Hover to speed up</span></footer>
<div id="tip"></div>
<script src="data.js"></script>
<script>
var m=document.getElementById('m'),tip=document.getElementById('tip'),rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
PROJ.forEach(function(p,i){
 var a=document.createElement('a');a.className='row'+(p.u?'':' soon');a.href=p.u||'#';
 var one='<span>'+p.t+'</span><i>'+p.n+' / '+(p.u?p.k:'coming soon')+'</i>',tr=document.createElement('div');tr.className='tr';
 tr.innerHTML=one.repeat(8);a.appendChild(tr);m.appendChild(a);
 var half=null,anim=null;
 requestAnimationFrame(function(){half=tr.scrollWidth/2;
  if(rm){return}
  var dir=i%2?1:-1,from=dir<0?0:-half,to=dir<0?-half:0;
  anim=tr.animate([{transform:'translateX('+from+'px)'},{transform:'translateX('+to+'px)'}],{duration:(38+i*4)*1000,iterations:Infinity});
 });
 a.addEventListener('mouseenter',function(){if(anim)anim.updatePlaybackRate(6);tip.textContent=p.n+'  '+p.k;tip.style.opacity=1});
 a.addEventListener('mouseleave',function(){if(anim)anim.updatePlaybackRate(1);tip.style.opacity=0});
 if(!p.u)a.addEventListener('click',function(e){e.preventDefault()});
});
addEventListener('pointermove',function(e){tip.style.left=e.clientX+'px';tip.style.top=e.clientY+'px'});
</script></body></html>
